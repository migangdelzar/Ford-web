name: Release Ford Web
run-name: ${{ format('Release Ford Web [{0}] {1} {2}', inputs.release_request_id || 'manual', inputs.version || 'rollback', inputs.source_sha || 'recorded') }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a verified commit or roll back by redeploying a previously verified commit
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      version:
        description: Immutable annotated vMAJOR.MINOR.PATCH tag (deploy only)
        type: string
        required: false
      source_sha:
        description: Full commit SHA targeted by the version tag or selected for rollback
        type: string
        required: false
      release_request_id:
        description: Coordinator correlation ID used to track release-all requests.
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ford-web-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      operation: ${{ steps.source.outputs.operation }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out release tooling from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve and validate source commit
        id: source
        env:
          RELEASE_REF: ${{ github.ref }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_REF}" == 'refs/heads/main' ]] || {
            echo 'Run Ford Web releases from main.' >&2
            exit 1
          }
          operation="${INPUT_OPERATION:-deploy}"
          if [[ "$operation" != "deploy" && "$operation" != "rollback" ]]; then
            echo "operation must be deploy or rollback" >&2
            exit 1
          fi
          sha="$INPUT_SHA"
          version="$INPUT_VERSION"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$operation" == "deploy" ]]; then
            if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "deploy requires a canonical vMAJOR.MINOR.PATCH version" >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/${version}:refs/tags/${version}"
            if [[ "$(git cat-file -t "refs/tags/${version}")" != "tag" || "$(git rev-parse "refs/tags/${version}^{commit}")" != "$sha" ]]; then
              echo "version must be an annotated tag targeting source_sha" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$sha" refs/remotes/origin/main || {
              echo "release tag source must be reachable from main" >&2
              exit 1
            }
            runs="$(gh api "/repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&status=success&per_page=100")"
            jq -e --arg sha "$sha" --arg version "$version" \
              '.workflow_runs | any(.head_sha == $sha and .head_branch == $version and .conclusion == "success")' \
              <<<"$runs" >/dev/null || {
              echo "version tag has no successful CI run for its exact SHA" >&2
              exit 1
            }
          elif [[ "$operation" == "rollback" ]]; then
            count="$(gh run list --repo "$GH_REPO" --workflow ci.yml --commit "$sha" --status success --limit 1 --json databaseId --jq 'length')"
            if [[ "$count" != "1" ]]; then
              echo "rollback source must have a successful CI run: $sha" >&2
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Check API contract
        run: bun run api:check -- openapi.ford-service.yaml

      - name: Check Pages Functions build
        run: bun run pages:check

  production-readiness:
    name: Require production release readiness
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Fail clearly when production deployment is disabled
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_DEPLOY_ENABLED" == 'true' ]] || {
            echo 'Production Pages release blocked: set PRODUCTION_DEPLOY_ENABLED=true after production readiness review.' >&2
            exit 1
          }

  deploy:
    needs: [verify, production-readiness]
    if: ${{ github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' && needs.production-readiness.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    outputs:
      deployment_id: ${{ steps.deploy-pages.outputs.deployment_id }}
      deployment_url: ${{ steps.deploy-pages.outputs.deployment_url }}
    steps:
      - name: Validate Cloudflare production credentials and project access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_URL: ${{ vars.FORD_WEB_SMOKE_URL }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            echo 'Production Pages release blocked: add CLOUDFLARE_API_TOKEN to the production environment secrets.' >&2
            exit 1
          }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$SMOKE_URL" ]] || {
            echo 'Production Pages release blocked: configure CLOUDFLARE_ACCOUNT_ID and FORD_WEB_SMOKE_URL as production environment variables.' >&2
            exit 1
          }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.success == true and .result.status == "active"' >/dev/null || {
              echo 'Production Pages release blocked: Cloudflare API token is invalid, inactive, or missing required access.' >&2
              exit 1
            }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/emme-crm-ui" \
            | jq -e '.success == true and .result.name == "emme-crm-ui"' >/dev/null || {
              echo 'Production Pages release blocked: Cloudflare token cannot access the emme-crm-ui project.' >&2
              exit 1
            }

      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build selected commit
        run: bun run build

      - name: Check API contract
        run: bun run api:check -- openapi.ford-service.yaml

      - name: Check Pages Functions build
        run: bun run pages:check

      - name: Deploy immutable source commit
        id: deploy-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          OPERATION: ${{ needs.verify.outputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "rollback" ]]; then
            prior_count="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/emme-crm-ui/deployments?env=production" \
              | jq --arg sha "$SOURCE_SHA" \
                '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.name == "deploy" and .latest_stage.status == "success")] | length')"
            if [[ "$prior_count" == "0" ]]; then
              echo "rollback source has no successful prior production Pages deployment: $SOURCE_SHA" >&2
              exit 1
            fi
          fi
          bunx wrangler pages deploy dist \
            --project-name emme-crm-ui \
            --branch main \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "$OPERATION $SOURCE_SHA"
          deployment="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/emme-crm-ui/deployments?env=production" \
            | jq -cer \
              --arg sha "$SOURCE_SHA" \
              '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.branch == "main" and .deployment_trigger.metadata.commit_hash == $sha and .latest_stage.name == "deploy" and .latest_stage.status == "success")][0] | select(.id != null and .url != null) | {id: .id, url: .url, details: .deployment_trigger.metadata.commit_message}')"
          deployment_id="$(jq -r '.id' <<< "$deployment")"
          deployment_url="$(jq -r '.url' <<< "$deployment")"
          deployment_details="$(jq -r '.details' <<< "$deployment")"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Ford Web deployment"
            echo "- Operation: $OPERATION"
            echo "- Source commit: $SOURCE_SHA"
            echo "- Version: ${VERSION:-rollback}"
            echo "- Project: emme-crm-ui"
            echo "- Deployment ID: $deployment_id"
            echo "- Deployment URL: $deployment_url"
            echo "- Deployment details: $deployment_details"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check public deployment
        env:
          SMOKE_URL: ${{ vars.FORD_WEB_SMOKE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SMOKE_URL" ]]; then
            echo "Set FORD_WEB_SMOKE_URL in the production environment" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$SMOKE_URL" -o /dev/null
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 \
            "${SMOKE_URL%/}/api/v1/health" -o /dev/null

  release-result:
    name: Record Pages release and deployment identity
    needs: [verify, production-readiness, deploy]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.production-readiness.result == 'success' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Write release result manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployed = os.environ["DEPLOYMENT_RESULT"] == "success"
          result = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "version": os.environ["VERSION"] or None,
              "tag": os.environ["VERSION"] or None,
              "sourceSha": os.environ["SOURCE_SHA"],
              "imageDigest": None,
              "deploymentId": os.environ["DEPLOYMENT_ID"] or None if deployed else None,
              "deploymentUrl": os.environ["DEPLOYMENT_URL"] or None if deployed else None,
          }
          Path(os.environ["RUNNER_TEMP"], "release-result.json").write_text(
              json.dumps(result, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload release result artifact
        uses: actions/upload-artifact@v7
        with:
          name: ford-release-result
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: error
          retention-days: 90

name: Release Ford Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a verified commit or roll back by redeploying a previously verified commit
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      source_sha:
        description: Full commit SHA; required for a manual deploy or rollback
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ford-web-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      operation: ${{ steps.source.outputs.operation }}
    steps:
      - name: Resolve and validate source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          operation="${INPUT_OPERATION:-deploy}"
          if [[ "$operation" != "deploy" && "$operation" != "rollback" ]]; then
            echo "operation must be deploy or rollback" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            sha="$EVENT_SHA"
          else
            sha="$INPUT_SHA"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_sha must be a full 40-character commit SHA" >&2
              exit 1
            fi
          fi
          if [[ "$operation" == "rollback" ]]; then
            count="$(gh run list --repo "$GH_REPO" --workflow ci.yml --commit "$sha" --status success --limit 1 --json databaseId --jq 'length')"
            if [[ "$count" != "1" ]]; then
              echo "rollback source must have a successful CI run: $sha" >&2
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Check API contract
        run: bun run api:check -- openapi.ford-service.yaml

      - name: Check Pages Functions build
        run: bun run pages:check

  deploy:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build selected commit
        run: bun run build

      - name: Check API contract
        run: bun run api:check -- openapi.ford-service.yaml

      - name: Check Pages Functions build
        run: bun run pages:check

      - name: Deploy immutable source commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          OPERATION: ${{ needs.verify.outputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "rollback" ]]; then
            prior_deployments="$(mktemp)"
            bunx wrangler pages deployment list \
              --project-name ford-web-ui \
              --environment production \
              --json > "$prior_deployments"
            prior_count="$(jq --arg sha "${SOURCE_SHA:0:7}" \
              '[.[] | select(.Source == $sha and .Environment == "Production" and .Status == "Success")] | length' \
              "$prior_deployments")"
            rm -f "$prior_deployments"
            if [[ "$prior_count" == "0" ]]; then
              echo "rollback source has no successful prior production Pages deployment: $SOURCE_SHA" >&2
              exit 1
            fi
          fi
          bunx wrangler pages deploy dist \
            --project-name ford-web-ui \
            --branch main \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "$OPERATION $SOURCE_SHA"
          deployment_json="$(mktemp)"
          bunx wrangler pages deployment list \
            --project-name ford-web-ui \
            --environment production \
            --json > "$deployment_json"
          deployment="$(jq -cer --arg sha "${SOURCE_SHA:0:7}" \
            '[.[] | select(.Source == $sha and .Environment == "Production" and .Status == "Success")][0] | {id: .Id, url: .Deployment, details: .Build}' \
            "$deployment_json")"
          rm -f "$deployment_json"
          deployment_id="$(jq -r '.id' <<< "$deployment")"
          deployment_url="$(jq -r '.url' <<< "$deployment")"
          deployment_details="$(jq -r '.details' <<< "$deployment")"
          {
            echo "### Ford Web deployment"
            echo "- Operation: $OPERATION"
            echo "- Source commit: $SOURCE_SHA"
            echo "- Project: ford-web-ui"
            echo "- Deployment ID: $deployment_id"
            echo "- Deployment URL: $deployment_url"
            echo "- Deployment details: $deployment_details"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check public deployment
        env:
          SMOKE_URL: ${{ vars.FORD_WEB_SMOKE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SMOKE_URL" ]]; then
            echo "Set FORD_WEB_SMOKE_URL in the production environment" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SMOKE_URL" -o /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            "${SMOKE_URL%/}/api/v1/health" -o /dev/null

tags:
  - name: Authentication
  - name: Test lab
paths:
  /api/auth/login:
    get:
      tags: [Authentication]
      summary: Start operator sign-in
      description: Legacy BFF sign-in route retained during rollback window; the current UI authenticates directly with Spring Security.
      operationId: startOperatorLogin
      deprecated: true
      security: []
      responses:
        '302':
          description: Redirect to the same-origin Spring Authorization Server login page.
          headers:
            Location:
              schema: { type: string, format: uri }
        '503':
          $ref: '#/components/responses/BffUnavailable'
  /api/auth/callback:
    get:
      tags: [Authentication]
      summary: Complete operator sign-in
      description: Legacy BFF callback retained during rollback window; the current UI uses the Spring Security session.
      operationId: completeOperatorLogin
      deprecated: true
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the CRM after creating the server-side session.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Secure, HttpOnly, SameSite session cookie. OAuth tokens are not included.
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BffBadRequest'
components:
  responses:
    BffBadRequest:
      description: Request is malformed or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BffUnavailable:
      description: Auth server or Ford-service is unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
